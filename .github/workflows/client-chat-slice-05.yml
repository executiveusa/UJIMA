name: Client Chat Slice 05 Durable Work States

on:
  pull_request:
    paths:
      - 'services/mission-api/src/agent/client-work-state.js'
      - 'services/mission-api/src/agent/firstmate-mission-router.js'
      - 'services/mission-api/src/agent/client-chat-router.js'
      - 'services/mission-api/src/agent/client-chat-store.js'
      - 'apps/site/components/ClientChatShell.jsx'
      - 'apps/site/components/ClientChatShell.module.css'
      - 'apps/site/tests/client-work-state.test.js'
      - 'apps/site/tests/client-work-state-review-regressions.test.js'
      - 'apps/site/tests/firstmate-mission-router.test.js'
      - 'apps/site/tests/client-chat-store.test.js'
      - 'control-plane/contracts/chat-mission-handoff.schema.json'
      - 'control-plane/contracts/client-chat-session.schema.json'
      - 'icm/client-chat-loop/05-durable-work-states/**'
      - '.github/workflows/client-chat-slice-05.yml'

permissions:
  contents: read

jobs:
  durable-work-states:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Repository boundary guard
        run: npm run guard:repo
      - name: Run Slice 05 and predecessor regressions
        run: npx vitest run apps/site/tests/client-work-state.test.js apps/site/tests/client-work-state-review-regressions.test.js apps/site/tests/firstmate-mission-router.test.js apps/site/tests/client-chat-store.test.js
      - name: Build client surface
        run: npm run build --workspace @asc3nd/site
