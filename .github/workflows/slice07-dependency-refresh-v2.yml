name: Slice 07 Dependency Refresh V2

on:
  push:
    branches:
      - client-chat-loop/07-deployment-final-gauntlet
    paths:
      - '.github/workflows/slice07-dependency-refresh-v2.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-chat-loop/07-deployment-final-gauntlet
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh and verify production dependency lockfile
        run: |
          npm install --package-lock-only
          npm audit fix --package-lock-only --omit=dev
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Commit dependency metadata
        run: |
          if git diff --quiet -- package-lock.json package.json apps/site/package.json services/mission-api/package.json; then
            echo 'No dependency metadata changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json package.json apps/site/package.json services/mission-api/package.json
          git commit -m 'slice07: refresh patched production dependency lockfile'
          git push origin HEAD:client-chat-loop/07-deployment-final-gauntlet
