name: UJIMA Source Bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Repository boundary guard
        run: npm run guard:repo

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Create exact source bundle
        run: |
          mkdir -p release-artifacts
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='release-artifacts' \
            -czf release-artifacts/ujima-source-${GITHUB_SHA}.tgz .
          printf '%s\n' "${GITHUB_SHA}" > release-artifacts/REVISION

      - name: Upload exact source bundle
        uses: actions/upload-artifact@v4
        with:
          name: ujima-source-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7
